version: "2"
linters:
  # The standard set is what this repository was already linted with; sloglint is
  # the one addition, because the logger package is the fleet's logger and its
  # call-site rules have to hold here first.
  enable:
    - sloglint
  settings:
    sloglint:
      # Scope: sloglint and govet's slog analyser recognise log/slog and types
      # embedding *slog.Logger. logger.Logger embeds *log.Logger precisely so that
      # these rules reach the call sites in every module that uses it -- see the
      # package doc. They do not reach a call made through a hand-written wrapper,
      # which is the reason the wrapper was dropped.
      #
      # no-mixed-args is on by default and is the rule that matters most: it
      # allows a pure-attribute call such as log.Error(msg, logger.Err(err)) and a
      # pure key-value call such as log.Info(msg, "volumeID", id), but rejects
      # mixing the two forms in one call. kv-only is deliberately NOT set, because
      # it would outlaw logger.Err(err), which is the intended way to log an error
      # with this library.
      #
      # static-msg and no-raw-keys are left off: the modules still build most
      # messages with fmt.Sprintf, and converting them is a separate change.
      args-on-same-line: true
      forbidden-keys:
        # Reserved by the handler; shadowing them silently drops the real value.
        - level
        - msg
        - source
        - stacktrace
        - time
