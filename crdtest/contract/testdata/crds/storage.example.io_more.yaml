apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: examplestorageclasses.storage.example.io
spec:
  group: storage.example.io
  names:
    kind: ExampleStorageClass
    plural: examplestorageclasses
    singular: examplestorageclass
    categories:
      - d8-storage
      - d8-storage-classes
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].reason
        - name: Connection
          type: string
          jsonPath: .spec.storageConnectionName
        - name: Pool
          type: string
          jsonPath: .spec.pool
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                storageConnectionName:
                  type: string
                pool:
                  type: string
                accessKeyID:
                  type: string
                accessKeySecret:
                  type: string
                  x-kubernetes-sensitive-data: true
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: not-a-crd
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: brokenstorageconnections.storage.example.io
spec:
  group: storage.example.io
  names:
    kind: BrokenStorageConnection
    plural: brokenstorageconnections
    singular: brokenstorageconnection
    shortNames:
      - bsconn
      - lvg
    categories:
      - d8-storage
  scope: Cluster
  versions:
    - name: v1alpha0
      served: false
      storage: false
      schema:
        openAPIV3Schema:
          type: object
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.reason
          priority: 1
        - name: Address
          type: string
          jsonPath: .spec.address
        - name: Age
          type: string
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                address:
                  type: string
                login:
                  type: string
                password:
                  type: string
                credentialsSecretName:
                  type: string
                auth:
                  type: object
                  properties:
                    chap:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
